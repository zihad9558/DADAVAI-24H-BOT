name: DADAVAI 24H BOT TEST

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check Bot File
        run: |
          echo "WORKFLOW CHECK STARTED"
          pwd
          ls -l bot.py
          grep -n "DADAVAI NEW BOT VERSION 2 STARTED" bot.py || true

      - name: Start Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          echo "BOT START STEP"
          timeout 240s python -u bot.py || test $? -eq 124
