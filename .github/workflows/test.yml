name: DADAVAI 24H BOT V5

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Verify V5 Code
        run: |
          echo "CHECKING BOT VERSION"
          grep -n "DADAVAI V5 BOT READY" bot.py
          python -m py_compile bot.py

      - name: Start Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: |
          echo "STARTING DADAVAI V5"
          timeout 240s python -u bot.py || test $? -eq 124
